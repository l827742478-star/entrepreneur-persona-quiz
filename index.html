* {

html,

body {

button,

button {

button:focus-visible,

.app-shell {

.site-header {

.site-mark {

.site-mark span {

.content {

.cover-screen,

.cover-screen {

}

.eyebrow {

.cover-title {

  letter-spacing: -0.08em;

}

.cover-title .highlight,
.result-name .highlight {
  position: relative;
  z-index: 0;
  display: inline-block;
}

.cover-title .highlight::before,
.result-name .highlight::before {
  position: absolute;
  z-index: -1;
  right: -5px;
  bottom: 7px;
  left: -7px;
  height: 0.42em;
  border-radius: 4px 2px 3px 3px;
  background: var(--marker);
  content: "";
  transform: rotate(-1.4deg);
}

.cover-lede {
  max-width: 370px;
  margin: 20px 0 0;
  color: #5e5c58;
  font-size: 16px;
  line-height: 1.8;
}

.hero-art {
  display: block;
  width: min(100%, 460px);
  margin: 14px auto 4px;
  object-fit: contain;
  object-position: center bottom;
  filter: saturate(0.92);
}

.hero-art--result {
  width: 210px;
  margin: 2px auto 0;
}

.primary-button,
.secondary-button {
  min-height: 54px;
  border: 0;
  border-radius: 999px;
  padding: 0 26px;
  font-size: 16px;
  font-weight: 700;
  transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
}

.primary-button {
  color: var(--white);
  background: var(--coral);
  box-shadow: 0 12px 24px rgba(239, 101, 89, 0.2);
}

.primary-button:hover {
  background: var(--coral-dark);
  transform: translateY(-2px);
  box-shadow: 0 16px 28px rgba(239, 101, 89, 0.24);
}

.secondary-button {
  color: var(--ink);
  border: 1px solid var(--hairline);
  background: var(--white);
}

.secondary-button:hover {
  border-color: #cbc7ba;
  background: #fffef8;
  transform: translateY(-1px);
}

.cover-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-top: 4px;
}

.cover-note,
.result-note {
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.question-screen {
  padding: 10px 0 28px;
}

.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
}

.progress-meta strong {
  color: var(--ink);
  font-size: 18px;
  letter-spacing: -0.04em;
}

.progress-track {
  height: 5px;
  overflow: hidden;
  border-radius: 999px;
  background: #e9e7df;
}

.progress-value {
  height: 100%;
  border-radius: inherit;
  background: var(--coral);
  transition: width 300ms ease;
}

.question-kicker {
  margin: 50px 0 16px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.08em;
}

.question-title {

  margin: 0;
  font-size: clamp(28px, 7vw, 50px);
  font-weight: 800;
  letter-spacing: -0.08em;
  line-height: 1.25;
}

.question-note {
  margin: 14px 0 30px;
  color: var(--muted);
  font-size: 14px;
}

.option-list {
  display: grid;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.option-button {
  display: grid;
  width: 100%;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 14px;
  align-items: center;
  min-height: 68px;
  border: 1px solid var(--hairline);
  border-radius: 16px;
  padding: 12px 16px;
  color: var(--ink);
  background: var(--white);
  text-align: left;
  line-height: 1.55;
  transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
}

.option-button:hover {
  border-color: #c9c2a4;
  transform: translateX(3px);
}

.option-button[aria-pressed="true"] {
  border-color: var(--marker-strong);
  background: #fffceb;
  box-shadow: inset 0 0 0 1px rgba(238, 219, 113, 0.42);
}

.option-letter {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
  background: #f0efe9;
  font-size: 13px;
  font-weight: 700;
}

.option-button[aria-pressed="true"] .option-letter {
  color: var(--ink);
  background: var(--marker);
}

.question-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 32px;
}

.text-button {
  min-height: 46px;
  border: 0;
  padding: 0 4px;
  color: var(--muted);
  background: transparent;
  font-size: 14px;
}

.text-button:hover {
  color: var(--ink);
}

.text-button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.result-screen {
  padding: 12px 0 30px;
}

.result-intro {
  margin: 18px 0 8px;
  color: var(--muted);
  font-size: 13px;
}

.result-card {
  overflow: hidden;
  margin-top: 6px;
  padding: 26px 22px 24px;
  border: 1px solid var(--hairline);
  background: var(--white);
  box-shadow: var(--shadow);
}

.result-card-top {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.1em;
}

.result-name {
  margin: 28px 0 8px;
  font-size: clamp(42px, 12vw, 72px);
  font-weight: 800;
  letter-spacing: -0.1em;
  line-height: 1;
}

.result-era {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.result-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 16px;
}

.result-keywords span {
  border-radius: 999px;
  padding: 6px 10px;
  color: #6a5d26;
  background: #fff7cd;
  font-size: 12px;
}

.result-tagline {
  max-width: 410px;
  margin: 22px 0 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.05em;
  line-height: 1.45;
}

.result-description {
  margin: 12px 0 0;
  color: #5e5c58;
  font-size: 15px;
  line-height: 1.85;
}

.result-divider {
  height: 1px;
  margin: 26px 0 20px;
  background: var(--hairline);
}

.result-proof {
  padding-top: 2px;
}

.result-section-kicker {
  margin-bottom: 8px;
  color: #9a8c45;
  font-size: 11px;
  letter-spacing: 0.1em;
}

.result-proof h2 {
  max-width: 470px;
  margin: 0;
  font-size: 21px;
  letter-spacing: -0.04em;
  line-height: 1.5;
}

.score-breakdown {
  display: grid;
  gap: 11px;
  margin-top: 20px;
}

.score-row-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 5px;
  color: #5e5c58;
  font-size: 12px;
}

.score-row-label strong {
  color: var(--ink);
  font-size: 12px;
}

.score-track {
  height: 5px;
  overflow: hidden;
  border-radius: 999px;
  background: #eeece4;
}

.score-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--marker-strong);
}

.evidence-list {
  display: grid;
  gap: 12px;
  margin: 22px 0 0;
  padding: 0;
  list-style: none;
  counter-reset: evidence;
}

.evidence-list li {
  display: grid;
  gap: 4px;
  padding-left: 28px;
  position: relative;
  color: #5e5c58;
  font-size: 13px;
  line-height: 1.55;
}

.evidence-list li::before {
  position: absolute;
  top: 1px;
  left: 0;
  color: var(--coral);
  content: counter(evidence, decimal-leading-zero);
  counter-increment: evidence;
  font-size: 11px;
  font-weight: 700;
}

.evidence-question {
  color: var(--muted);
}

.evidence-list strong {
  color: var(--ink);
  font-size: 14px;
}

.answer-audit {
  margin-top: 22px;
  border-top: 1px solid var(--hairline);
}

.answer-audit summary {
  padding: 16px 0 13px;
  color: var(--ink);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  list-style-position: inside;
}

.answer-audit-list {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.answer-audit-list li {
  display: grid;
  gap: 4px;
  padding: 13px 0 14px;
  border-top: 1px solid #f0eee8;
}

.answer-audit-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--coral);
  font-size: 11px;
  letter-spacing: 0.08em;
}

.answer-audit-top strong {
  color: #8c7f32;
  font-size: 11px;
  letter-spacing: 0;
}

.answer-audit-question {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.answer-audit-answer {
  color: var(--ink);
  font-size: 13px;
  line-height: 1.6;
}

.result-details {
  display: grid;
  gap: 22px;
}

.detail-block h3 {
  margin: 0 0 10px;
  font-size: 14px;
}

.detail-block p {
  margin: 0;
  color: #5e5c58;
  font-size: 14px;
  line-height: 1.8;
}

.detail-block--wide {
  padding-bottom: 6px;
}

.detail-block--scene {
  padding: 18px 18px 20px;
  border-left: 3px solid var(--marker-strong);
  background: #fffdf1;
}

.detail-block--split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.result-reminder {
  display: grid;
  gap: 8px;
  padding: 18px 0 2px;
  border-top: 1px solid var(--hairline);
}

.result-reminder span {
  color: var(--muted);
  font-size: 12px;
}

.result-reminder strong {
  font-size: 18px;
  letter-spacing: -0.04em;
  line-height: 1.5;
}

.result-strengths {
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px solid var(--hairline);
}

.strength-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.strength-list li {
  position: relative;
  padding-left: 20px;
  color: #5e5c58;
  font-size: 14px;
  line-height: 1.6;
}

.strength-list li::before {
  position: absolute;
  top: 0.62em;
  left: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--marker-strong);
  content: "";
}

.result-actions {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}

.tiny-footer {
  margin: 20px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  text-align: center;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 24px;
  z-index: 5;
  max-width: calc(100vw - 40px);
  border-radius: 999px;
  padding: 12px 16px;
  color: var(--white);
  background: var(--ink);
  box-shadow: 0 12px 30px rgba(41, 41, 41, 0.18);
  font-size: 13px;
  animation: toast-in 240ms ease both;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

@keyframes rise-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (min-width: 700px) {
  .app-shell {
    padding: 0 34px;
  }

  .content {
    padding-top: 34px;
  }

  .cover-screen {
    min-height: calc(100vh - 156px);
  }

  .cover-actions {
    margin-top: 16px;
  }

  .result-card {
    padding: 36px 34px 30px;
  }

  .detail-block--split {
    gap: 34px;
  }
}

@media (max-width: 480px) {
  .detail-block--split {
    grid-template-columns: 1fr;
    gap: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

const STORAGE_KEY = 'entrepreneur-persona-quiz-state-v1';

function scoreAnswers(answers) {
  return answers.reduce((totals, answer) => {
    for (const [profileId, score] of Object.entries(answer || {})) {
      totals[profileId] = (totals[profileId] || 0) + score;
    }
    return totals;
  }, {});
}

function getResultProfile(answers) {
  const totals = scoreAnswers(answers);
  const scoreBreakdown = PROFILE_IDS
    .map((profileId, order) => ({
      id: profileId,
      name: profiles[profileId].name,
      score: totals[profileId] ?? 0,
      order,
    }))
    .sort((a, b) => b.score - a.score || a.order - b.order)
    .map(({ order, ...item }) => item);
  const winner = scoreBreakdown[0]?.id || PROFILE_IDS[0];
  return { id: winner, ...profiles[winner], totals, scoreBreakdown };
}

function createInitialState() {
  return { answers: [], completed: false, resultId: null };
}

function saveState(storage, state) {
  storage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState(storage) {
  const raw = storage.getItem(STORAGE_KEY);
  if (!raw) return createInitialState();
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.answers)) return createInitialState();
    return {
      ...createInitialState(),
      ...parsed,
      answers: parsed.answers,
    };
  } catch {
    return createInitialState();
  }
}

function resetState(storage) {
  storage.removeItem(STORAGE_KEY);
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function getResultEvidence(result) {
  return state.answers
    .map((answer, index) => {
      const question = questions[index];
      const selected = question?.options[answer?.optionIndex];
      const score = Number(answer?.scores?.[result.id] || 0);
      if (!selected || score <= 0) return null;
      return {
        question: question.prompt,
        answer: selected.label,
        score,
      };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);
}

function getAnswerBreakdown(result) {
  return state.answers.map((answer, index) => {
    const question = questions[index];
    const selected = question?.options[answer?.optionIndex];
    const score = Number(answer?.scores?.[result.id] || 0);
    return {
      number: String(index + 1).padStart(2, '0'),
      question: question?.prompt || '',
      answer: selected?.label || '未选择',
      score,
    };
  });
}

function showToast(message) {
  document.querySelector('.toast')?.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.setAttribute('role', 'status');
  toast.textContent = message;
  document.body.append(toast);
  clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => toast.remove(), 2600);
}

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      showToast('结果已复制，去发给朋友看看吧');
      return;
    } catch {
      // Try the older clipboard path before falling back to the share sheet.
    }
  }

  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.append(textarea);
    textarea.select();
    const copied = document.execCommand('copy');
    textarea.remove();
    if (copied) {
      showToast('结果已复制，去发给朋友看看吧');
      return;
    }
  } catch {
    // Continue to the share fallback below.
  }

  if (navigator.share) {
    try {
      await navigator.share({ title: '我的企业家人物原型', text });
      showToast('已打开分享面板');
      return;
    } catch {
      // The browser may reject a share sheet when running in a preview frame.
    }
  }

  showToast('复制权限被浏览器拦截，可以截图保存结果');
}

function startQuiz() {
  if (state.completed) {
    state = createInitialState();
    currentIndex = 0;
  } else {
    currentIndex = Math.min(state.answers.length, questions.length - 1);
  }
  renderQuestion();
}

function chooseOption(index) {
  const question = questions[currentIndex];
  state.answers[currentIndex] = {
    optionIndex: index,
    scores: question.options[index].scores,
  };
  state.completed = false;
  state.resultId = null;
  saveState(storage, state);
  renderQuestion();
}

function goNext() {
  if (!state.answers[currentIndex]) return;
  if (currentIndex === questions.length - 1) {
    state.completed = true;
    state.resultId = getResultProfile(state.answers.map((answer) => answer.scores)).id;
    saveState(storage, state);
    renderResult();
    return;
  }
  currentIndex += 1;
  renderQuestion();
}

function goBack() {
  if (currentIndex > 0) {
    currentIndex -= 1;
    renderQuestion();
  }
}

function restart() {
  resetState(storage);
  state = createInitialState();
  currentIndex = 0;
  renderCover();
  showToast('已清空上一次测试');
}

app.addEventListener('click', (event) => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  if (action === 'start') startQuiz();
  if (action === 'choose') chooseOption(Number(button.dataset.index));
  if (action === 'next') goNext();
  if (action === 'back') goBack();
  if (action === 'restart') restart();
  if (action === 'share') copyText(button.dataset.shareText);
});

function render() {
  if (state.completed && state.answers.length === questions.length) {
    renderResult();
  } else {
    renderCover();
  }
}

render();
